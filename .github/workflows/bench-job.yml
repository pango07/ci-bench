name: bench-job
on:
  workflow_dispatch:
    inputs:
      only: {default: convex-helpers, description: Must remain convex-helpers}
      commits: {default: '12', description: Must remain the full original12}
      variants: {default: 'floor,plain,managed-control,managed', description: Exact original48 scope}
      end: {default: '', description: Default original c11; changed windows decline}
      warm_first: {default: 'false', description: Must remain false}
      cloud: {type: boolean, default: false, description: Must remain false}
permissions:
  contents: write
  actions: write
jobs:
  drive:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.18.0'
      - name: exact cold matrix window driver and fixture prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
          COMMITS: ${{ inputs.commits }}
          VARIANTS: ${{ inputs.variants }}
          BJ_END: ${{ inputs.end }}
          BJ_REPEAT_FIRST: ${{ inputs.warm_first }}
          BJ_CLOUD: ${{ inputs.cloud && 'true' || 'false' }}
        run: bash scripts/job/matrix-drive.sh "$ONLY" "$COMMITS" "$VARIANTS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bench-job
          path: ${{ runner.temp }}/bj/
          if-no-files-found: ignore

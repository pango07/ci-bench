# Isolated property47 experiment from K287e63; original108 workflow remains frozen in Git history.
name: bench-job-one
run-name: bench-job-one ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag: {required: true, description: Unique original-window invocation tag}
      repo: {required: true, description: Original public project}
      commit: {required: true, description: Exact original project SHA}
      variant: {required: true, description: floor/plain/managed-control/managed}
      cfg: {required: true, description: Original corpus commands as JSON}
      cache_namespace: {required: false, default: '', description: Independent cold namespace}
      cloud: {type: boolean, required: false, default: false, description: Must remain false}
permissions:
  contents: read
env:
  MATRIX_ACTION_SHA: '0520117d99379472cd33dbb777f852d8a189a20a' # Reviewed packaged property47 Action
  MATRIX_RUNTIME_SOURCE: 'f67fe14033de76f0b26b436cef4e5d50b0af1ee3' # MATRIX_SOURCE_SHA
  MATRIX_CANDIDATE_PROFILE: 'reviewed-original-property47-single-instance-v1-research'
jobs:
  native:
    name: job
    if: github.event_name == 'workflow_dispatch' && (inputs.variant == 'floor' || inputs.variant == 'plain')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: retain reviewed harness helper source
        if: inputs.variant != 'floor'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/job
          persist-credentials: false
      - name: copy helper outside project selection
        if: inputs.variant != 'floor'
        run: |
          mkdir -p "$RUNNER_TEMP/matrix-harness"
          cp scripts/job/matrix-evidence.cjs scripts/job/evidence.cjs scripts/job/property47-window-profile.cjs "$RUNNER_TEMP/matrix-harness/"
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: verify original Node declaration
        run: test "$(tr -d '\r\n' < .nvmrc)" = 24.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: capture ordinary full native JSON
        if: inputs.variant == 'plain'
        run: |
          cat > "$RUNNER_TEMP/bench-vitest-report.cjs" <<'JS'
          const entry = process.argv[1] || ''
          const hasOutput = process.argv.some(arg => /^--outputFile(?:\.json)?(?:=|$)/.test(arg))
          if (/(?:^|[\/])vitest(?:\.m?js)?$/.test(entry) && process.argv.includes('run') && !hasOutput)
            process.argv.push('--reporter=default', '--reporter=json', '--outputFile.json=' + process.env.BENCH_VITEST_REPORT)
          JS
          echo "BENCH_VITEST_REPORT=$RUNNER_TEMP/bench-vitest-report.json" >> "$GITHUB_ENV"
      - name: env
        env:
          E: ${{ fromJSON(inputs.cfg).env }}
        run: for kv in $E; do echo "$kv" >> "$GITHUB_ENV"; done
      - name: install
        if: inputs.variant != 'floor'
        env:
          CMD: ${{ fromJSON(inputs.cfg).install }}
        run: bash -c "$CMD"
      - name: build
        if: inputs.variant != 'floor'
        env:
          CMD: ${{ fromJSON(inputs.cfg).build }}
        run: bash -c "$CMD"
      - name: test
        if: inputs.variant != 'floor'
        env:
          CMD: ${{ fromJSON(inputs.cfg).test }}
          WD: ${{ fromJSON(inputs.cfg).workdir }}
          NODE_OPTIONS: --require=${{ runner.temp }}/bench-vitest-report.cjs
        run: cd "$WD" && bash -c "$CMD"
      - name: compare complete ordinary evidence
        if: always() && inputs.variant == 'plain'
        env:
          PROJECT_COMMIT: ${{ inputs.commit }}
        run: node "$RUNNER_TEMP/matrix-harness/matrix-evidence.cjs" collect plain "$GITHUB_WORKSPACE" "$RUNNER_TEMP/matrix-bench-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && inputs.variant == 'plain'
        with:
          name: matrix-evidence-${{ inputs.tag }}
          path: ${{ runner.temp }}/matrix-bench-evidence/
          if-no-files-found: error
  matrix:
    name: job
    if: github.event_name == 'workflow_dispatch' && (inputs.variant == 'managed' || inputs.variant == 'managed-control')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: ''
      NODE_PATH: ''
      NODE_PRESERVE_SYMLINKS: ''
      NODE_COMPILE_CACHE: ''
      ESBUILD_BINARY_PATH: ''
    steps:
      - name: retain reviewed harness helper source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/job
          persist-credentials: false
      - name: copy helper outside project selection
        run: |
          mkdir -p "$RUNNER_TEMP/matrix-harness"
          cp scripts/job/matrix-evidence.cjs scripts/job/evidence.cjs scripts/job/property47-window-profile.cjs "$RUNNER_TEMP/matrix-harness/"
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: verify original Node declaration
        run: test "$(tr -d '\r\n' < .nvmrc)" = 24.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: quod
        uses: pango07/quod-action@0520117d99379472cd33dbb777f852d8a189a20a # MATRIX_ACTION_SHA; reviewed packaged property47 Action
        with:
          managed-vitest: ${{ inputs.variant == 'managed-control' && 'matrix-property47-control' || 'matrix-property47' }}
          managed-env: '{"NODE_ENV":"test"}'
          managed-epoch: '1700000000000'
          managed-seed: '42'
          cache-namespace: ${{ inputs.cache_namespace }}
          cloud: 'false'
          task-cache: 'false'
      - name: env
        env:
          E: ${{ fromJSON(inputs.cfg).env }}
        run: for kv in $E; do echo "$kv" >> "$GITHUB_ENV"; done
      - name: install
        env:
          CMD: ${{ fromJSON(inputs.cfg).install }}
        run: bash -c "$CMD"
      - name: build
        env:
          CMD: ${{ fromJSON(inputs.cfg).build }}
        run: bash -c "$CMD"
      - name: test
        env:
          CMD: ${{ fromJSON(inputs.cfg).test }}
          WD: ${{ fromJSON(inputs.cfg).workdir }}
          NODE_OPTIONS: ''
        run: cd "$WD" && bash -c "$CMD"
      - name: compare complete logical evidence before post
        if: always()
        env:
          PROJECT_COMMIT: ${{ inputs.commit }}
          VARIANT: ${{ inputs.variant }}
          MATRIX_CACHE_NAMESPACE: ${{ inputs.cache_namespace }}
        run: node "$RUNNER_TEMP/matrix-harness/matrix-evidence.cjs" collect "$VARIANT" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/matrix-bench-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: matrix-evidence-${{ inputs.tag }}
          path: |
            ${{ runner.temp }}/matrix-bench-evidence/
            ${{ runner.temp }}/quod/matrix-run-*/
            ${{ runner.temp }}/quod/matrix-reports/
          if-no-files-found: error

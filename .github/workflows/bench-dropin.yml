# Drop-in compatibility: Quod added to real open-source CI test jobs the way a
# customer adds it (the action line + `permissions: id-token: write`), one
# matrix job per repository (scripts/dropin/corpus.json). Each job sets up
# the project as its CI does (pnpm / bun / corepack / setup-node, their
# install, their build), runs pango07/quod-action (v2: the test job records
# inline, a record replays once a second run agrees, QUOD_VITEST_WITNESSES=2;
# no shadow job), then runs N consecutive commits: plain and Quod per
# commit, compared per file and per test (scripts/dropin/run.sh). The
# scoreboard job collects every row (scoreboard.json and the job summary).
#
# The quod under test is `quod_bin`: the action installs it (its sha256
# checked by the action) and the job fails unless the binary the action's
# config points at is byte-for-byte that release's binary.
#
#   gh workflow run bench-dropin.yml -R pango07/ci-bench -f quod_bin=bin-32b630c
#   gh workflow run bench-dropin.yml -R pango07/ci-bench -f quod_bin=bin-32b630c -f only=axios,yup -f commits=3
name: bench-dropin

on:
  workflow_dispatch:
    inputs:
      only:
        description: Comma-separated corpus ids (empty = all)
        required: false
        default: ''
      commits:
        description: Commits per repository (a corpus entry may cap it lower)
        required: false
        default: '12'
      mode:
        description: "witness (the product: inline recording, QUOD_VITEST_WITNESSES=2, no shadow job) or shadow (the retired check + shadow pair)"
        required: false
        default: witness
        type: choice
        options: [witness, shadow]
      quod_bin:
        description: The quod under test (a bin-<sha> release of this repo); the action installs it and the job asserts it is what runs
        required: true
      hook_ref:
        description: Bench the hook.cjs of this pango07/quod-action ref instead of the pinned action's (empty = the action's)
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

jobs:
  corpus:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: m
        env:
          ONLY: ${{ inputs.only }}
        run: echo "matrix=$(node scripts/dropin/matrix.mjs "$ONLY")" >> "$GITHUB_OUTPUT"

  bench:
    needs: corpus
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.corpus.outputs.matrix) }}
    steps:
      # The bench's scripts go to the runner's temp; the workspace becomes the project.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _cibench
      - name: bench scripts, the project checkout, runner tools before set-up
        env:
          REPO: ${{ matrix.repo }}
          ID: ${{ matrix.id }}
          COMMITS: ${{ inputs.commits }}
        run: |
          mkdir -p "$RUNNER_TEMP/cibench" && cp -a _cibench/scripts "$RUNNER_TEMP/cibench/" && rm -rf _cibench
          node "$RUNNER_TEMP/cibench/scripts/dropin/env.mjs" "$ID" "$COMMITS" >> "$GITHUB_ENV"
          DROPIN_SHA=$(node -e 'const e=require(process.argv[1]).find(x=>x.id===process.argv[2]);console.log(e.sha)' "$RUNNER_TEMP/cibench/scripts/dropin/corpus.json" "$ID")
          DROPIN_COMMITS=$(node -e 'const e=require(process.argv[1]).find(x=>x.id===process.argv[2]);console.log(Math.min(+process.argv[3],e.commits??1e9))' "$RUNNER_TEMP/cibench/scripts/dropin/corpus.json" "$ID" "$COMMITS")
          echo "before set-up: node=$(command -v node) $(node --version 2>/dev/null); pnpm=$(command -v pnpm || echo none); yarn=$(command -v yarn || echo none) $(yarn --version 2>/dev/null); bun=$(command -v bun || echo none); corepack=$(command -v corepack || echo none)"
          git clone -q --filter=blob:none "https://github.com/$REPO" .
          start=$(git rev-list --first-parent -n $((DROPIN_COMMITS + 1)) "$DROPIN_SHA" | tail -1)
          git checkout -q "$start"
          echo "window start ${start:0:9} (window end ${DROPIN_SHA:0:9}, $DROPIN_COMMITS commits)"

      # ---- the repository's own set-up, as its CI job has it ----
      - name: corepack enable (before setup-node, as the repo's CI)
        if: matrix.corepack_first
        run: corepack enable
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        if: matrix.pnpm
      - uses: oven-sh/setup-bun@v2
        if: matrix.bun
        with:
          bun-version-file: ${{ matrix.bun_file }}
      - uses: actions/setup-node@v6
        if: matrix.node != '' || matrix.node_file != ''
        with:
          node-version: ${{ matrix.node }}
          node-version-file: ${{ matrix.node_file }}
      - name: corepack enable
        if: matrix.corepack
        run: corepack enable

      # The release under test, fetched independently of the action: its
      # tarball's sha256 (the action's `sha256` input, checked by the action)
      # and its binary (compared with what the action installed, below).
      - name: the quod under test (${{ inputs.quod_bin }})
        id: qbin
        env:
          GH_TOKEN: ${{ github.token }}
          B: ${{ inputs.quod_bin }}
        run: |
          [[ "$B" =~ ^bin-[0-9a-f]{7,40}$ ]] || { echo "::error::quod_bin must be a bin-<sha> release, got '$B'"; exit 2; }
          mkdir -p "$RUNNER_TEMP/qref"
          gh release download "$B" -R "$GITHUB_REPOSITORY" -p 'quod-linux-x86_64.tar.gz' -D "$RUNNER_TEMP/qref"
          sum=$(sha256sum "$RUNNER_TEMP/qref/quod-linux-x86_64.tar.gz" | cut -d' ' -f1)
          tar -C "$RUNNER_TEMP/qref" -xzf "$RUNNER_TEMP/qref/quod-linux-x86_64.tar.gz"
          bsum=$(sha256sum "$RUNNER_TEMP/qref/quod" | cut -d' ' -f1)
          echo "$B: tarball sha256 $sum, binary sha256 $bsum"
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          { echo "DROPIN_QUOD_BIN=$B"; echo "DROPIN_QUOD_BIN_SHA256=$bsum"; } >> "$GITHUB_ENV"

      # ---- the one line a customer adds (cloud off: the bench hands the ledger over locally) ----
      # v2 + the coverage hook (fix/coverage-v2) + yarn reach (fix/yarn-vitest3):
      # the action that ships with bin-32b630c. Dependencies and the task
      # cache off: the bench measures the test step, and a remote turbo cache
      # would answer plain and Quod alike.
      - uses: pango07/quod-action@76297ed9712e1e76381211b6d6f92c7b699e3aab # exp/supported-v1
        with:
          cloud: 'false'
          dependencies: 'false'
          task-cache: 'false'
          version: ${{ inputs.quod_bin }}
          sha256: ${{ steps.qbin.outputs.sha256 }}

      # Fails the job unless the quod the action's shim runs is the release
      # under test (the 2026-11-04 run benched the action's default
      # bin-d40c669 while naming bin-32b630c).
      - name: assert the installed quod is ${{ inputs.quod_bin }}
        run: |
          q=$(QUOD_SHIM_ACTIVE=1 node -p 'require(process.argv[1]).quod' "$RUNNER_TEMP/quod/config.json") || { echo "::error::the action wrote no config.json"; exit 2; }
          got=$(sha256sum "$q" | cut -d' ' -f1)
          echo "the action's quod: $q (sha256 $got); wanted $DROPIN_QUOD_BIN (sha256 $DROPIN_QUOD_BIN_SHA256)"
          [ "$got" = "$DROPIN_QUOD_BIN_SHA256" ] || { echo "::error::installed quod $q is not $DROPIN_QUOD_BIN (sha256 $got != $DROPIN_QUOD_BIN_SHA256)"; exit 2; }
          case "$q" in */quod/"$DROPIN_QUOD_BIN"/quod) ;; *) echo "::error::installed quod path $q is not the $DROPIN_QUOD_BIN install"; exit 2 ;; esac
      - name: drop-in bench (${{ inputs.mode }})
        env:
          DROPIN_MODE: ${{ inputs.mode }}
          DROPIN_HOOK_REF: ${{ inputs.hook_ref }}
        run: bash "$RUNNER_TEMP/cibench/scripts/dropin/run.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dropin-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/dropin/row.json
            ${{ runner.temp }}/dropin/report.md
            ${{ runner.temp }}/dropin/ci.md
            ${{ runner.temp }}/dropin/metrics.json
            ${{ runner.temp }}/dropin/results.jsonl
            ${{ runner.temp }}/dropin/pr.txt
            ${{ runner.temp }}/dropin/logs
            ${{ runner.temp }}/dropin/cov
          if-no-files-found: ignore

  scoreboard:
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dropin-*
          path: ${{ runner.temp }}/rows
      - run: |
          mkdir -p "$RUNNER_TEMP/sb" "$RUNNER_TEMP/rows"
          node scripts/dropin/scoreboard.mjs "$RUNNER_TEMP/rows" "$RUNNER_TEMP/sb" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scoreboard
          path: ${{ runner.temp }}/sb

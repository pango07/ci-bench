# What a syscall recorder (strace) costs on convex-helpers' npm scripts,
# and how many distinct inputs they read.
name: probe-strace
on:
  workflow_dispatch:
    inputs:
      bin:
        required: false
        default: ''
  push:
    branches: ['probe/runner']
    paths: ['.github/workflows/probe-strace.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: get-convex/convex-helpers
          ref: 5eaa7e5160736054d53f8b71e2c522835eb427e0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: quod unit as root (the gate's e2e)
        env:
          BIN: ${{ github.event.inputs.bin || 'bin-cb5d92d' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$BIN" -R pango07/ci-bench -p 'quod-linux-x86_64.tar.gz' -D $RUNNER_TEMP/q0
          tar -xzf $RUNNER_TEMP/q0/*.tar.gz -C $RUNNER_TEMP/q0; Q=$(find $RUNNER_TEMP/q0 -name quod -type f | head -1)
          W=$PWD/e2e; mkdir -p $W/repo; echo one > $W/repo/in.txt; cd $W/repo
          for who in "" "sudo env HOME=$HOME PATH=$PATH"; do
            rm -rf $W/units$RANDOM; D=$W/units-$(echo "$who" | wc -c)
            for i in 1 2 3; do $who $Q unit --dir $D --root $W/repo -- sh -c 'mkdir -p out && cat in.txt > out/o.txt && echo built'; echo "exit $?"; rm -rf out; done
          done
          sudo bwrap --dev-bind / / --tmpfs /tmp --proc /proc --unshare-net --unshare-pid --die-with-parent -- strace -f -o /dev/null true; echo "root bwrap+strace $?"
      - name: quod unit (record, witness, answer) on build and test:release
        env:
          BIN: ${{ github.event.inputs.bin || 'bin-3dcd587' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$BIN" -R pango07/ci-bench -p 'quod-linux-x86_64.tar.gz' -D $RUNNER_TEMP/q
          tar -xzf $RUNNER_TEMP/q/*.tar.gz -C $RUNNER_TEMP/q; Q=$(find $RUNNER_TEMP/q -name quod -type f | head -1)
          D=$RUNNER_TEMP/units; R=$PWD
          NPM=$(dirname $(readlink -f $(which npm)))/npm-cli.js
          u() { /usr/bin/time -o /tmp/t -f %e $Q unit --dir $D --root $R -- $(which node) $NPM run "$@" > /tmp/o 2> /tmp/e; c=$?; echo "== $* exit $c $(cat /tmp/t) s"; grep '^quod' /tmp/e; tail -3 /tmp/o; }
          for i in 1 2 3; do rm -rf dist; u build; u test:release; done
          ls dist | head -3
          for f in $D/*/ledger.json; do node -e 'const l=require(process.argv[1]);const r=l.records[0];if(r){const k=r.keys.map(x=>x[0].split(":")[0]);const c={};for(const x of k)c[x]=(c[x]||0)+1;console.log(l.argv.slice(-1)[0],JSON.stringify(c),r.outputs.length,"outs")}else console.log(l.argv.slice(-1)[0],l.always)' $f; done
      - name: plain
        run: |
          t() { /usr/bin/time -o /tmp/t -f "%e" "$@" > /dev/null 2>&1; echo "$(cat /tmp/t)"; }
          for i in 1 2 3; do echo "plain test:release $(t npm run test:release) s"; done
          for i in 1 2; do echo "plain build $(t npm run build) s"; done
          for i in 1 2; do echo "plain(UV_USE_IO_URING=0) test:release $(UV_USE_IO_URING=0 t npm run test:release) s"; done
      - name: strace without --seccomp-bpf (the old probe)
        run: |
          t() { /usr/bin/time -o /tmp/t -f "%e" "$@" > /dev/null 2>&1; echo "$(cat /tmp/t)"; }
          T='trace=%file,%process,getdents64,connect,io_uring_setup'
          echo "strace test:release $(t strace -f -qq -y -e $T -o /tmp/old.log npm run test:release) s"
      - name: strace --seccomp-bpf, UV_USE_IO_URING=0 (through-the-wall B1)
        run: |
          t() { /usr/bin/time -o /tmp/t -f "%e" "$@" > /dev/null 2>&1; echo "$(cat /tmp/t)"; }
          T='trace=%file,%process,getdents64,%network,io_uring_setup,io_uring_enter,io_uring_register'
          S="strace -f --seccomp-bpf -qq -yy -s 4096 -e $T"
          export UV_USE_IO_URING=0
          for i in 1 2 3; do echo "seccomp test:release $(t $S -o /tmp/tr$i.log npm run test:release) s"; done
          for i in 1 2; do echo "seccomp build $(t $S -o /tmp/bu$i.log npm run build) s"; done
          # without -s 4096 -yy (cheaper decoding), for the record
          echo "seccomp-lite test:release $(t strace -f --seccomp-bpf -qq -y -e $T -o /tmp/lite.log npm run test:release) s"
          for f in /tmp/tr1.log /tmp/bu1.log; do
            echo "$f: $(wc -l < $f) lines, $(grep -c 'execve(' $f) execs, $(grep -c 'io_uring_setup(' $f) io_uring_setup, $(grep -c 'connect(' $f) connects, $(du -h $f | cut -f1)"
            grep -oE '"(/[^"]*)"' $f | sort -u | wc -l | xargs echo "distinct absolute paths:"
            grep -oE 'execve\("[^"]*"' $f | sort | uniq -c | sort -rn | head -6
          done
          grep 'connect(' /tmp/tr1.log | head -5
          grep -c 'io_uring' /tmp/old.log | xargs echo "io_uring lines without UV_USE_IO_URING=0:"
          strace -V | head -1
          grep -m3 'io_uring_setup(' /tmp/tr1.log
      - name: strace --seccomp-bpf, io_uring_setup refused (inject ENOSYS), in bwrap
        run: |
          t() { /usr/bin/time -o /tmp/t -f "%e" "$@" > /dev/null 2>&1; echo "$(cat /tmp/t)"; }
          T='trace=%file,%process,getdents64,%network,io_uring_setup,io_uring_enter,io_uring_register'
          S="strace -f --seccomp-bpf -qq -yy -s 4096 -e $T -e inject=io_uring_setup:error=ENOSYS"
          for i in 1 2; do echo "inject test:release $(t $S -o /tmp/in$i.log npm run test:release) s"; done
          echo "inject build $(t $S -o /tmp/inb.log npm run build) s"
          for f in /tmp/in1.log /tmp/inb.log; do
            echo "$f: $(grep -c 'io_uring_setup(' $f) io_uring_setup, $(grep 'io_uring_setup(' $f | grep -vc 'ENOSYS') not refused, $(grep -c 'io_uring_enter(' $f) enter"
          done
          B="bwrap --dev-bind / / --tmpfs /tmp --proc /proc --unshare-net --unshare-pid --die-with-parent"
          echo "bwrap plain test:release $(t $B -- npm run test:release) s"
          echo "bwrap inject test:release $(t $B -- $S -o $RUNNER_TEMP/bw.log npm run test:release) s"
          echo "bwrap inject build $(t $B -- $S -o $RUNNER_TEMP/bwb.log npm run build) s"
          $B -- npm run test:release 2>&1 | tail -12
          grep -c 'io_uring_setup(' $RUNNER_TEMP/bw.log
